name: PR

on:
  push:
    branches: [main]
  pull_request:

# The job only reads this repository.
permissions:
  contents: read

jobs:
  # Format and root lint only: the suites need exemplar, so exemplar's CI runs them, with its matching branch.
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The lockfile links exemplar's packages to a checkout beside this one; empty packages stand in for it.
      - name: Stand in for the exemplar checkout
        run: |
          for name in $(grep -o "'@exemplarjs/[a-z-]*'" pnpm-workspace.yaml | tr -d "'" | cut -d/ -f2); do
            mkdir -p "../exemplar/packages/$name"
            echo "{\"name\":\"@exemplarjs/$name\",\"version\":\"0.0.0\"}" > "../exemplar/packages/$name/package.json"
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:root
