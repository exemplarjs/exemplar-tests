version: 2
updates:
  # The workflows' actions, pinned to commits. A release must be a week old, as in pnpm-workspace.yaml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  # The project's dependencies, from pnpm-workspace.yaml's catalog and each package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore
